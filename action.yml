name: Contrast
description: 'Contrast PR previews + branch builds for this repo. Auto-dispatches based on the event, or set `mode` to `preview` or `build` to invoke a specific role.'
author: Contrast

# usage:
#
#   - uses: sootbean/soot-preview-action@v1
#     with:
#       start: pnpm dev:all:lite   # whatever command boots your app
#
# by default the action auto-detects your package manager (npm / yarn / pnpm /
# bun) from the lockfile + package.json `packageManager` field and installs with
# it. override with `package-manager:` or a custom `install:` command. if your
# workflow already runs its own setup (checkout + node + install, e.g. a repo
# `./.github/actions/setup` composite) BEFORE this action, pass
# `package-manager: none` and the action skips straight to the preview/build.
#
# the canonical published copy of this action lives at
# https://github.com/sootbean/soot-preview-action (public). this file in
# sootbean/soot is the source of truth; the public repo mirrors it.
#
# behavior (default `mode: auto`):
#   - on pull_request: runs the interactive contrast preview agent (LLM-gated)
#   - on push to a tracked branch: runs the branch-build pipeline for every
#     enabled platform; result lands at /build/<owner>/<repo>/<branch>
#   - other events are ignored
#
# to avoid two workflow runs per PR-branch push (one push event + one
# pull_request synchronize event firing for the same SHA), filter your
# workflow's `on: push:` to your default branch only, and split jobs:
#
#   on:
#     push: { branches: [main] }
#     pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
#   jobs:
#     preview:
#       if: github.event_name == 'pull_request'
#       steps: [..., uses: sootbean/soot-preview-action@v1, with: { mode: preview, start: ... }]
#     build:
#       if: github.event_name == 'pull_request' || github.event_name == 'push'
#       strategy: { matrix: { platform: [ios] } }
#       steps: [..., uses: sootbean/soot-preview-action@v1, with: { mode: build, platform: '${{ matrix.platform }}', start: ... }]
#
# the runner script handles waiting for the dev server to come up — do NOT
# add a "wait for ready" step in your workflow. it also derives the github
# repo id + installation id from the (owner, repo) tuple, so no repo vars
# are needed.

branding:
  icon: zap
  color: orange

inputs:
  start:
    description: Command that boots the app dev server in the background (e.g. "pnpm dev:all:lite"). Leave blank if your app is already up by the time this action runs.
    required: false
    default: ''
  port:
    description: Port the dev server listens on. Defaults to 8081 (metro/expo).
    required: false
    default: '8081'
  node-version:
    description: 'Node.js version to install (via actions/setup-node). Ignored when `package-manager: none`.'
    required: false
    default: '24'
  package-manager:
    description: |
      Which package manager to set up and install with: `auto` (default — detected from the lockfile / package.json `packageManager` field), or an explicit `npm` | `yarn` | `pnpm` | `bun`, or `none` to skip toolchain setup + install entirely (use when your workflow already ran its own setup composite before this action).
    required: false
    default: auto
  install:
    description: |
      Override the install command entirely (e.g. `pnpm install --filter ./apps/mobile...` for a monorepo). Leave blank to use the package-manager default (`npm ci`, `yarn install --immutable/--frozen-lockfile`, `pnpm install --frozen-lockfile`, `bun install --frozen-lockfile`). Ignored when `package-manager: none`.
    required: false
    default: ''
  pnpm-version:
    description: pnpm version to install (only used when the resolved package manager is pnpm). Leave empty to read from your package.json's `packageManager` field (recommended — matches your lockfile).
    required: false
    default: ''
  origin:
    description: Override the Contrast cloud origin (defaults to https://contrast.dev).
    required: false
    default: 'https://contrast.dev'
  mode:
    description: |
      Explicit dispatch override: `preview` (interactive contrast agent) or `build` (branch-build pipeline). Default `auto` dispatches by `github.event_name` (pull_request → preview, push → build). Set to `preview` or `build` when you want a single workflow run to invoke this action in multiple jobs (e.g. one preview job + one build matrix) regardless of the triggering event.
    required: false
    default: auto
  platform:
    description: 'When `mode=build`, the single platform to build (`ios` or `android`). Leave blank to iterate every enabled platform from /api/build/config. Wire to a matrix value for matrix parallelism.'
    required: false
    default: ''
  maestro:
    description: |
      Maestro flow paths (comma-separated), or `auto` to run every `.maestro/*.yaml` discovered in the repo. Empty (default) disables. Each flow runs against the bundle the build step just captured, in SootSim (headless chrome on the same ubuntu runner — no macOS, no .app, no simulator), and uploads as its own `/preview/<id>` with the maestro recording layered on top.
    required: false
    default: ''
  maestro-on:
    description: |
      Which event types trigger maestro flows. CSV of `pull_request,push:main,push:staging`. Defaults to `pull_request`.
    required: false
    default: 'pull_request'
  runner:
    description: |
      Where the preview recording executes: `local` (default — the contrastbot agent, SootSim, and the recording all run on this workflow's runner) or `hosted` (this runner only serves the dev stack through a token-gated tunnel; a Contrast GPU recorder drives and records it, producing dramatically smoother videos than a CPU-only CI runner). `hosted` requires the Carbon plan.
    required: false
    default: 'local'
  build-env:
    description: |
      Newline-separated `KEY=VALUE` pairs exported into the dev/start shell so metro bakes them into the captured bundle. Use for runtime keys whose dev instance is bound to a specific origin — e.g. point Clerk/auth/api endpoints at a sootsim.com-allowed staging instance so the preview's dev-login works. Example:
        build-env: |
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_…
          EXPO_PUBLIC_API_BASE=https://staging-api.example.com
      Treat these as secrets and source them from your repo or environment secrets.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # resolve the package manager once so the toolchain setup + install steps
    # below stay in sync. `auto` reads the package.json `packageManager` field
    # first (corepack-style, matches the lockfile), then falls back to whichever
    # lockfile is present. `none` disables setup + install (repo did its own).
    - name: Resolve package manager
      id: pm
      shell: bash
      env:
        CONTRAST_PM_INPUT: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        pm="${CONTRAST_PM_INPUT:-auto}"
        if [ "$pm" = auto ] || [ -z "$pm" ]; then
          field="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"\([a-zA-Z]*\)@.*/\1/p' package.json 2>/dev/null | head -n1)"
          if [ -n "$field" ]; then pm="$field"
          elif [ -f pnpm-lock.yaml ]; then pm=pnpm
          elif [ -f yarn.lock ]; then pm=yarn
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then pm=bun
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then pm=npm
          else pm=npm
          fi
        fi
        # actions/setup-node only caches npm | yarn | pnpm; bun/none get no cache.
        case "$pm" in
          npm|yarn|pnpm) cache="$pm" ;;
          *) cache="" ;;
        esac
        {
          echo "pm=$pm"
          echo "node_cache=$cache"
        } >> "$GITHUB_OUTPUT"
        echo "[contrast] package manager: $pm (node cache: ${cache:-none})"

    - name: Set up pnpm
      if: steps.pm.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Bun
      if: steps.pm.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@v2

    - name: Set up Node
      if: steps.pm.outputs.pm != 'none'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.pm.outputs.node_cache }}

    - name: Install dependencies
      if: steps.pm.outputs.pm != 'none'
      shell: bash
      env:
        CONTRAST_PM: ${{ steps.pm.outputs.pm }}
        CONTRAST_INSTALL_OVERRIDE: ${{ inputs.install }}
      run: |
        set -euo pipefail
        if [ -n "${CONTRAST_INSTALL_OVERRIDE}" ]; then
          echo "[contrast] install (override): ${CONTRAST_INSTALL_OVERRIDE}"
          eval "${CONTRAST_INSTALL_OVERRIDE}"
          exit 0
        fi
        case "${CONTRAST_PM}" in
          pnpm) pnpm install --frozen-lockfile ;;
          # yarn berry (.yarnrc.yml / .yarn/releases) uses --immutable; classic uses --frozen-lockfile.
          yarn)
            if [ -f .yarnrc.yml ] || [ -d .yarn/releases ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
          bun) bun install --frozen-lockfile ;;
          npm) npm ci ;;
          *) echo "[contrast] unknown package manager '${CONTRAST_PM}', skipping install" ;;
        esac

    - name: Contrast preview / build
      shell: bash
      env:
        # the contrast runner reads everything from env. nothing here is secret
        # apart from GITHUB_TOKEN (auto-injected, repo-scoped).
        CONTRAST_INSTALLATION_TOKEN: ${{ github.token }}
        CONTRAST_REPO: ${{ github.repository }}
        CONTRAST_REPO_ID: ${{ github.event.repository.id }}
        CONTRAST_EVENT_NAME: ${{ github.event_name }}
        CONTRAST_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        CONTRAST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        CONTRAST_RUN_ID: ${{ github.run_id }}
        CONTRAST_RUN_ATTEMPT: ${{ github.run_attempt }}
        CONTRAST_PR_NUMBER: ${{ github.event.pull_request.number }}
        CONTRAST_PR_TITLE: ${{ github.event.pull_request.title }}
        CONTRAST_PR_DRAFT: ${{ github.event.pull_request.draft }}
        CONTRAST_DEV_START: ${{ inputs.start }}
        CONTRAST_DEV_PORT: ${{ inputs.port }}
        CONTRAST_CLOUD: ${{ inputs.origin }}
        CONTRAST_MODE: ${{ inputs.mode }}
        CONTRAST_PLATFORM: ${{ inputs.platform }}
        # the runner copies its $WORK_DIR diagnostic dump (agent.out/err,
        # sticky comment markdown, per-step .out/.err) here before cleanup,
        # so the upload-artifact step below can ship a downloadable bundle
        # on the github actions run page.
        CONTRAST_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/.contrast-agent-logs
        # maestro flows run against the bundle captured by mode:build via
        # `bun sootsim maestro test ... --preview` (same headless-chrome
        # path as /preview, no .app or simulator). see
        # plans/maestro-flow-action-integration.md.
        CONTRAST_MAESTRO_FLOWS: ${{ inputs.maestro }}
        CONTRAST_MAESTRO_ON: ${{ inputs.maestro-on }}
        # runner: hosted → this job serves the dev stack through a
        # token-gated tunnel and a Contrast GPU recorder drives + records
        # (mode 2). the recorder posts the sticky comment / check runs from
        # its own run of the same script.
        CONTRAST_RUNNER: ${{ inputs.runner }}
        # newline-separated KEY=VALUE pairs run.sh exports into the dev
        # shell so the captured metro bundle bakes in runtime keys
        # (Clerk PK, API base, etc.) for a sootsim-friendly staging
        # instance. fixes "Auth failed to initialize" by letting the
        # bundle ship a Clerk key whose allowed-origins include
        # sootsim.com. plans/preview-share-bug-tracker.md #B1.
        CONTRAST_BUILD_ENV: ${{ inputs.build-env }}
      run: |
        runner_script="$(mktemp "${RUNNER_TEMP:-/tmp}/contrast-runner.XXXXXX")"
        trap 'rm -f "$runner_script"' EXIT
        # download before executing so an HTTP error cannot become an empty,
        # successful bash pipeline.
        curl --fail --show-error --silent --location \
          -H 'cache-control: no-cache' \
          --output "$runner_script" \
          "${CONTRAST_CLOUD}/api/github/agent/run.sh?run=${GITHUB_RUN_ID:-local}"
        bash "$runner_script"

    # always upload — most useful for failed/timed-out runs where the
    # sticky comment can't carry enough context. retention is short because
    # the data is dense (every probe's stdout/stderr) and only matters for
    # the immediate post-mortem.
    - name: Upload Contrast agent diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: contrast-agent-logs-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.platform && format('-{0}', inputs.platform) || '' }}
        path: ${{ github.workspace }}/.contrast-agent-logs/
        retention-days: 7
        if-no-files-found: ignore
